<svg width="560" height="380" viewBox="0 0 560 380" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="windowClip">
      <rect x="0" y="0" width="560" height="340" rx="12"/>
    </clipPath>
  </defs>

  <g transform="translate(0,20)">
    <rect x="0" y="0" width="560" height="340" rx="12" fill="#101820"/>
    <g clip-path="url(#windowClip)">
      <rect x="0" y="0" width="560" height="36" fill="#161F27"/>
      <circle cx="22" cy="18" r="6" fill="#3A454E"/>
      <circle cx="42" cy="18" r="6" fill="#3A454E"/>
      <circle cx="62" cy="18" r="6" fill="#3A454E"/>
      <text x="280" y="23" text-anchor="middle" font-family="IBM Plex Mono, SFMono-Regular, Menlo, monospace" font-size="12" fill="#5B6875">nativedev — install</text>

      <g font-family="IBM Plex Mono, SFMono-Regular, Menlo, monospace" font-size="14.5">
        <text x="24" y="66" fill="#3FA79A">$</text>
        <text x="42" y="66" fill="#D7DCE0">sudo apt install ./nativedev_1.0.0_all.deb</text>

        <text x="24" y="98" fill="#7A8794">Detecting native services…</text>

        <text x="40" y="126" fill="#9AA5AF">nginx</text>
        <text x="200" y="126" fill="#C98A3E">found</text>

        <text x="40" y="150" fill="#9AA5AF">php8.3-fpm</text>
        <text x="200" y="150" fill="#C98A3E">found</text>

        <text x="40" y="174" fill="#9AA5AF">mariadb</text>
        <text x="200" y="174" fill="#C98A3E">found</text>

        <text x="40" y="198" fill="#9AA5AF">systemd units</text>
        <text x="200" y="198" fill="#3FA79A">ready</text>

        <text x="24" y="234" fill="#3FA79A">$</text>
        <text x="42" y="234" fill="#D7DCE0">nativedev --dashboard</text>

        <text x="24" y="262" fill="#7A8794">Dashboard ready at </text>
        <text x="185" y="262" fill="#5FB8AC">https://app.test</text>

        <rect x="24" y="278" width="9" height="16" fill="#3FA79A">
          <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="1.1s" repeatCount="indefinite"/>
        </rect>
      </g>
    </g>
  </g>
</svg>
